name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev
      - name: Build minimum supported Vim
        run: |
          git clone --depth 1 --branch v9.1.0219 https://github.com/vim/vim.git "$RUNNER_TEMP/vim"
          cd "$RUNNER_TEMP/vim"
          ./configure --with-features=normal --disable-gui --without-x --prefix="$RUNNER_TEMP/vim-install"
          make -j2
          make install
          echo "$RUNNER_TEMP/vim-install/bin" >> "$GITHUB_PATH"
      - name: Run regression tests
        run: |
          vim --version
          vim -Nu NONE -i NONE -n -es -S test/run.vim
      - name: Show test failures
        if: failure()
        run: cat test-errors.log 2>/dev/null || true
      - name: Check whitespace
        run: git show --format= --check HEAD
